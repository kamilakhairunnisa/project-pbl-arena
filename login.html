<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - ARENA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/login.css">
</head>
<body class="login-page">
  <main class="card">
    <section class="hero">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div class="brand-text">
          <span class="brand-name">ARENA</span>
          <span class="brand-sub">Student Portal</span>
        </div>
      </div>
      <div class="hero-copy">
        <blockquote class="hero-quote">“Satu pintu untuk setiap pengajuan kegiatan - dari proposal sampai persetujuan.”</blockquote>
        <p class="hero-note">Kelola aktivitas organisasi kampus dengan alur yang lebih jelas, cepat, dan transparan.</p>
      </div>
    </section>

    <section class="panel">
      <form class="form" action="#" method="post">
        <p class="eyebrow">SELAMAT DATANG KEMBALI</p>
        <h1 class="title">Masuk ke Akun Kamu</h1>

        <div class="field">
          <label for="email">Alamat email</label>
          <input id="email" name="email" type="email" placeholder="Masukkan email anda" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Kata sandi</label>
          <input id="password" name="password" type="password" placeholder="Masukkan kata sandi anda" autocomplete="current-password" required>
        </div>

        <button class="btn" type="submit">Masuk &gt;</button>
      </form>
    </section>
  </main>
</body>
</html>
